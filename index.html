<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grocery List</title>
<script>
  // Applied before CSS paints, so there's no flash of the wrong theme.
  (function () {
    try {
      if (localStorage.getItem('grocery.theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* storage unavailable — dark default is fine */ }
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== Login ===== -->
<div id="login-screen" class="screen">
  <form id="login-form" class="login-card">
    <div class="login-brand">🛒 Grocery List</div>
    <p class="login-sub">Sign in to manage your list</p>

    <label for="login-username">Username</label>
    <input id="login-username" type="text" autocomplete="username" placeholder="Username" />

    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" />

    <p id="login-error" class="error-text" hidden>Incorrect username or password.</p>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
</div>

<!-- ===== App ===== -->
<div id="app" class="app" hidden>

  <aside class="sidebar">
    <div class="sidebar-brand">🛒 Smart List</div>
    <nav id="listNav" class="list-nav"></nav>
    <div class="sidebar-user">👤 ASWATHY</div>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1 id="pageTitle">Grocery List</h1>
        <p id="pageSummary" class="page-summary"></p>
      </div>
      <div class="header-actions">
        <button id="themeBtn" class="btn btn-ghost" type="button">🌙 Dark</button>
        <button id="signOutBtn" class="btn btn-ghost" type="button">Sign out</button>
      </div>
    </header>

    <nav class="view-tabs">
      <button class="view-tab" data-view="list" id="tabList">List <span class="count" id="countActive">0</span></button>
      <button class="view-tab" data-view="add" id="tabAdd">Add item</button>
      <button class="view-tab" data-view="removed" id="tabRemoved">Removed <span class="count" id="countRemoved">0</span></button>
      <div class="tab-spacer"></div>
      <button id="undoBtn" class="btn btn-icon" type="button" title="Undo" disabled>↩</button>
      <button id="redoBtn" class="btn btn-icon" type="button" title="Redo" disabled>↪</button>
    </nav>

    <section class="card">

      <!-- Add item -->
      <div id="view-add" class="view">
        <form id="addForm" class="add-form">
          <div class="field">
            <label for="itemName">Item</label>
            <input id="itemName" type="text" placeholder="e.g. Milk, Puff pastry, Tortilla chips" autocomplete="off" />
          </div>
          <div class="field">
            <label for="categoryInput">Category</label>
            <input id="categoryInput" list="categoryOptions" type="text" placeholder="Start typing or pick a category" autocomplete="off" />
            <datalist id="categoryOptions"></datalist>
            <p id="suggestionHint" class="hint" hidden></p>
          </div>
          <div class="field-row">
            <div class="field field-small">
              <label for="quantityInput">Qty</label>
              <input id="quantityInput" type="number" min="1" value="1" />
            </div>
            <div class="field field-small">
              <label for="unitInput">Unit</label>
              <select id="unitInput">
                <option value="pcs">pcs</option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="l">l</option>
                <option value="ml">ml</option>
                <option value="pack">pack</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Add to list</button>
        </form>
      </div>

      <!-- Active list -->
      <div id="view-list" class="view">
        <input id="searchInput" type="text" class="search-input" placeholder="Search this list…" />
        <div id="listGroups" class="groups"></div>
      </div>

      <!-- Removed items -->
      <div id="view-removed" class="view">
        <div id="removedGroups" class="groups"></div>
      </div>

    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="script.js"></script>
</body>
</html>
