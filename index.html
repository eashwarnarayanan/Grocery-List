<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery List</title>
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script src="script.js" defer></script>
</head>
<body>
  <!-- Login Container -->
  <div id="loginContainer" class="auth-card">
    <h2>Welcome Back 👋</h2>
    <p>Sign in to sync your grocery list across devices</p>
    <div class="input-group">
      <input type="text" id="usernameInput" placeholder="Username" autocomplete="off" />
      <input type="password" id="passwordInput" placeholder="Password" />
      <button id="loginBtn">Sign In</button>
    </div>
    <p id="loginError" class="error-msg" style="display: none;"></p>
  </div>

  <!-- Main App Container -->
  <div id="appContainer" class="app-card" style="display: none;">
    <header class="app-header">
      <h1>Grocery List 🛒</h1>
      <div class="header-actions">
        <button id="undoBtn" title="Undo">↩️ Undo</button>
        <button id="redoBtn" title="Redo">↪️ Redo</button>
        <button id="shareBtn" title="Share List">📋 Share</button>
        <button id="logoutBtn" title="Logout">Logout</button>
      </div>
    </header>

    <div class="add-item-form">
      <input type="text" id="itemInput" placeholder="Add an item (e.g. Milk, Apples)..." autocomplete="off" />
      <input type="text" id="categoryInput" placeholder="Category (optional)" autocomplete="off" />
      <button id="addItemBtn">Add Item</button>
    </div>

    <div class="filter-bar">
      <button class="filter-chip active" data-category="All">All</button>
    </div>

    <ul id="groceryList" class="item-list"></ul>
  </div>
</body>
</html>
