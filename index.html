<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grocery List</title>
<script>
  // Applied before CSS paints, so there's no flash of the wrong theme.
  (function () {
    try {
      if (localStorage.getItem('grocery.theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* storage unavailable — dark default is fine */ }
  })();
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== Login ===== -->
<div id="login-screen" class="screen">
  <form id="login-form" class="login-card">
    <div class="login-brand">🛒 Grocery List</div>
    <p class="login-sub">Sign in to manage your smart grocery list</p>

    <label for="login-username">Username</label>
    <input id="login-username" type="text" autocomplete="username" placeholder="Username" />

    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" />

    <p id="login-error" class="error-text" hidden>Incorrect username or password.</p>

    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
</div>

<!-- ===== App ===== -->
<div id="app" class="app" hidden>

  <aside class="sidebar">
    <div class="sidebar-brand">🛒 Smart List</div>
    <nav id="listNav" class="list-nav"></nav>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1 id="pageTitle">Grocery List <span class="live-badge">LIVE</span></h1>
        <p class="page-subtitle">Smart Auto-Categorised Shopping Assistant</p>
      </div>
      <div class="header-actions">
        <span class="chip">👤 ASWATHY</span>
        <button id="themeBtn" class="chip chip-btn" type="button">🌙 Dark</button>
        <button id="signOutBtn" class="chip chip-btn danger" type="button">Sign Out</button>
      </div>
    </header>

    <nav class="tabs-row">
      <button class="pill" id="tabList" type="button">Active List <span class="count" id="countActive">0</span></button>
      <button class="pill pill-primary" id="toggleAddBtn" type="button">+ Add Item</button>
      <button class="pill" id="tabRemoved" type="button">Removed <span class="count" id="countRemoved">0</span></button>
      <div class="tab-spacer"></div>
      <button id="undoBtn" class="pill" type="button" disabled>↩ Undo</button>
      <button id="redoBtn" class="pill" type="button" disabled>↪ Redo</button>
    </nav>

    <section class="card">

      <!-- Add item panel (toggled by the "+ Add Item" pill; sits above the list) -->
      <div id="addPanel" class="add-panel">
        <h3>Add New Grocery Item</h3>
        <form id="addForm">
          <label for="itemName">Item Name</label>
          <input id="itemName" type="text" placeholder="e.g. Puff pastry, Apples, Milk..." autocomplete="off" />

          <label for="categoryInput">Category (auto-detected or custom)</label>
          <input id="categoryInput" type="text" placeholder="e.g. 🍞 Bakery" autocomplete="off" />
          <p class="hint">💡 Quick select or type a custom category to teach the app!</p>

          <label>Quick Categories</label>
          <div id="quickCategories" class="chip-grid"></div>

          <label for="customChipInput">Add Custom Category Chip</label>
          <div class="inline-row">
            <input id="customChipInput" type="text" placeholder="e.g. 🐾 Pet Supplies" />
            <button type="button" id="addChipBtn" class="btn">Add</button>
          </div>

          <div class="field-row">
            <div class="field-small">
              <label for="quantityInput">Quantity</label>
              <input id="quantityInput" type="number" min="1" value="1" />
            </div>
            <div
